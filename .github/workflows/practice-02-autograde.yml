name: "Practice 02: Autograde"

# pull_request_target runs THIS file from main, in the base repo, so GitHub
# does not sit on "Waiting for approval" for every student fork PR.
# That is safe here only because we never execute anything from the PR:
# we check out the student's files with credentials off, then grep them
# with the logic below (not their scripts/). Do not add a step that runs
# student-provided bash/js/Makefile.
on:
  pull_request_target:
    branches: [main]
    paths:
      - "practices/02-git-github/**"

concurrency:
  group: practice-02-autograde-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Grade the PR
        env:
          PR_COMMITS: ${{ github.event.pull_request.commits }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          total=0
          commits="${PR_COMMITS:-0}"
          notes="practices/02-git-github/NOTES.md"
          contrib="practices/02-git-github/CONTRIBUTORS.md"

          if [ "$commits" -ge 3 ]; then
            commit_row="| At least 3 commits in this PR | 40/40 | ✅ ($commits commits) |"
            total=$((total + 40))
          else
            commit_row="| At least 3 commits in this PR | 0/40 | ❌ (only $commits commits) |"
          fi

          if [ -f "$notes" ] && ! grep -q "replace this line" "$notes"; then
            notes_row="| NOTES.md placeholders replaced | 30/30 | ✅ |"
            total=$((total + 30))
          else
            notes_row="| NOTES.md placeholders replaced | 0/30 | ❌ |"
          fi

          if [ -f "$contrib" ] && [ -s "$contrib" ]; then
            contrib_row="| CONTRIBUTORS.md exists with your name | 30/30 | ✅ |"
            total=$((total + 30))
          else
            contrib_row="| CONTRIBUTORS.md exists with your name | 0/30 | ❌ |"
          fi

          {
            echo "### 🤖 Practice 02 autograder: $total / 100"
            echo
            echo "| Check | Points | Result |"
            echo "|---|---|---|"
            echo "$commit_row"
            echo "$notes_row"
            echo "$contrib_row"
            echo
            echo "<sub>Commit \`$PR_SHA\`</sub>"
          } > grade-comment.md

          cat grade-comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post or update the sticky grade comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('grade-comment.md', 'utf8');
            const marker = '### 🤖 Practice 02 autograder';
            const prNumber = context.payload.pull_request.number;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const existing = comments.find(c => c.body.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
