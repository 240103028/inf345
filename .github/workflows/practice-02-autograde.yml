name: "Practice 02: Autograde"

# pull_request_target uses this file from main so student fork PRs do not
# sit on "Waiting for approval". We never check out the fork (that is the
# pwn-request footgun, and checkout@v4 ignores allow-unsafe-pr-checkout).
# Files are read via the API as inert text; do not add a step that runs
# student-provided bash/js/Makefile.
on:
  pull_request_target:
    branches: [main]
    paths:
      - "practices/02-git-github/**"

concurrency:
  group: practice-02-autograde-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Grade the PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_COMMITS: ${{ github.event.pull_request.commits }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/pr
          notes=/tmp/pr/NOTES.md
          contrib=/tmp/pr/CONTRIBUTORS.md
          total=0
          commits="${PR_COMMITS:-0}"

          fetch_file() {
            local path="$1"
            local dest="$2"
            if gh api -H "Accept: application/vnd.github.raw" \
                "repos/${HEAD_REPO}/contents/${path}?ref=${PR_SHA}" \
                > "$dest"; then
              return 0
            fi
            rm -f "$dest"
            return 1
          }

          fetch_file "practices/02-git-github/NOTES.md" "$notes" || true
          fetch_file "practices/02-git-github/CONTRIBUTORS.md" "$contrib" || true

          if [ "$commits" -ge 3 ]; then
            commit_row="| At least 3 commits in this PR | 40/40 | ✅ ($commits commits) |"
            total=$((total + 40))
          else
            commit_row="| At least 3 commits in this PR | 0/40 | ❌ (only $commits commits) |"
          fi

          if [ -f "$notes" ] && ! grep -q "replace this line" "$notes"; then
            notes_row="| NOTES.md placeholders replaced | 30/30 | ✅ |"
            total=$((total + 30))
          else
            notes_row="| NOTES.md placeholders replaced | 0/30 | ❌ |"
          fi

          if [ -f "$contrib" ] && [ -s "$contrib" ]; then
            contrib_row="| CONTRIBUTORS.md exists with your name | 30/30 | ✅ |"
            total=$((total + 30))
          else
            contrib_row="| CONTRIBUTORS.md exists with your name | 0/30 | ❌ |"
          fi

          {
            echo "### 🤖 Practice 02 autograder: $total / 100"
            echo
            echo "| Check | Points | Result |"
            echo "|---|---|---|"
            echo "$commit_row"
            echo "$notes_row"
            echo "$contrib_row"
            echo
            echo "<sub>Commit \`$PR_SHA\`</sub>"
          } > "$GITHUB_WORKSPACE/grade-comment.md"

          cat "$GITHUB_WORKSPACE/grade-comment.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Post or update the sticky grade comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('grade-comment.md', 'utf8');
            const marker = '### 🤖 Practice 02 autograder';
            const prNumber = context.payload.pull_request.number;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const existing = comments.find(c => c.body.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
